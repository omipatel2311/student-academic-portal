
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>StudentHub Portal</h1>
        <p>Student Registration Form</p>
    </header>

    <main class="container">
        <form id="registrationForm" novalidate>
            <h2>Create Your Account</h2>
            <p class="intro">Enter your details to register.</p>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" autocomplete="name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" autocomplete="email">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile"
                       placeholder="10-digit mobile number"
                       inputmode="numeric" maxlength="10" autocomplete="tel">
                <small class="error" id="mobileError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password"
                       autocomplete="new-password">
                <div class="strength-track">
                    <div id="strengthBar"></div>
                </div>
                <small id="strengthText">Password strength: Not entered</small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Re-enter your password"
                       autocomplete="new-password">
                <small class="error" id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value="">Select your course</option>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="CSE">Computer Science</option>
                    <option value="Other">Other</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <div class="form-group">
                <label for="year">Academic Year</label>
                <select id="year" name="year">
                    <option value="">Select year</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>
                <small class="error" id="yearError"></small>
            </div>

            <fieldset class="form-group">
                <legend>Gender</legend>
                <label class="radio-label">
                    <input type="radio" name="gender" value="Male"> Male
                </label>
                <label class="radio-label">
                    <input type="radio" name="gender" value="Female"> Female
                </label>
                <label class="radio-label">
                    <input type="radio" name="gender" value="Other"> Other
                </label>
                <small class="error" id="genderError"></small>
            </fieldset>

            <div class="form-group">
                <label class="terms-label">
                    <input type="checkbox" id="terms" name="terms">
                    I accept the terms and conditions.
                </label>
                <small class="error" id="termsError"></small>
            </div>

            <button type="submit" class="submit-btn">Register Now</button>
            <p id="successMessage" role="status" aria-live="polite"></p>
        </form>
    </main>

    <footer>
        <p>StudentHub Portal | WDF Practical 5</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
