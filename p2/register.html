<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>StudentHub Portal</h1>
        <p>Your Academic Companion</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section class="content-box">
            <h2 class="page-title">Student Registration</h2>
            <p class="intro">Fill in your details to create an account.</p>

            <form action="#" method="post">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>

                <label for="enrollment">Enrollment Number</label>
                <input type="text" id="enrollment" name="enrollment"
                       placeholder="Enter enrollment number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>

                <button type="submit">Register</button>

            </form>

            <p>Already registered?
                <a href="login.html">Login here</a>
            </p>
        </section>
    </main>

    <footer>
        <p>StudentHub Portal | WDF Practical</p>
    </footer>

</body>
</html>
